name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r admin/requirements.txt pytest
      - name: Tests backend et admin
        run: python -m pytest

  syntax-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la syntaxe JavaScript
        run: |
          node --check desktop/app.js
          node --check admin/static/admin.js
          node --check frontend/static/radar.js
      - name: Valider docker-compose
        run: ADSB_INTERNAL_TOKEN=test-token docker compose config >/dev/null

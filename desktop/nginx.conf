server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Endpoint interne pour le healthcheck Docker.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets locaux (Leaflet, styles, logique de l'interface).
    location /vendor/ {
        try_files $uri =404;
        expires 7d;
    }

    # Le frontend desktop consomme les mêmes données aéroports/pistes que le
    # scope mobile. Nginx les relaie depuis le service frontend pour éviter
    # toute duplication des jeux de données.
    location /data/ {
        proxy_pass http://frontend:80/static/data/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        expires 1h;
    }

    # Carte principale tar1090, servie par le conteneur dédié et exposée sous
    # la même origine que le desktop pour l'iframe.
    location = /tar1090 {
        return 301 /tar1090/;
    }

    location /tar1090/ {
        proxy_pass http://tar1090:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # L'interface appelle /api sur la même origine : Nginx relaie au backend.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_buffering off;
    }

    # Application mono-page.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Marque la page comme interface desktop avant l'exécution du JS.
    sub_filter '<body>' '<body class="desktop-mode">';
    sub_filter_once on;

    # Endpoint interne pour le healthcheck Docker.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Type MIME explicite pour le manifeste Web App.
    location = /static/manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
        expires -1;
    }

    # Les assets statiques du scope.
    location /static/ {
        try_files $uri =404;
        expires -1;
    }

    # Le frontend appelle /api sur la même origine : Nginx relaie au backend.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_buffering off;
    }

    # Application mono-page.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
